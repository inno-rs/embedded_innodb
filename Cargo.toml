[package]
name = "embedded_innodb"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4" }
env_logger = "0.11"
strum = { version = "0.27.1" }
strum_macros = { version = "0.27.1" }
intrusive-collections = { version = "0.9" }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0" }