[package]
name = "embedded_innodb"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11"
strum = "0.25"
strum_macros = "0.25"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0" }