[package]
name = "embedded_innodb"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
rstest = { version = "0.25.0" }
criterion = { version = "0.6.0" }
pretty_assertions = { version = "1.4.1" }

[dependencies]
crc32fast = { version = "1.4.2" }
ctor = { version = "0.4.2" }
derive_builder = { version = "0.20.2" }
fixedbitset = { version = "0.5.7" }
intrusive-collections = { version = "0.9.7" }
libc = { version = "0.2.172" }
once_cell = "1.21.3"
parking_lot = { version = "0.12.1" }
rand = { version = "0.9.1" }
rand_chacha = { version = "0.9.0" }
strum_macros = { version = "0.27.1" }
tempfile = { version = "3.20.0" }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0" }


[lib]
name = "innodb"
path = "src/lib.rs"

[[bench]]
name = "fold_buffer"
harness = false
